[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-store-lite"
version = "0.1.0"
description = "A lightweight feature store for ML: point-in-time correct offline retrieval, online serving with TTL, and drift detection."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "pydantic>=2.0",
    "numpy>=1.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
